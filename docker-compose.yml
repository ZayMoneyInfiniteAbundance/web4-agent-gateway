version: '3.8'

services:
  web4-agent-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web4-agent-gateway
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - PAY_TO_ADDRESS=${PAY_TO_ADDRESS:-0x2E3344DfF97a679b8E401fF9E74E856Cf56c6315}
      - NETWORK=${NETWORK:-eip155:8453}
      - FACILITATOR_URL=${FACILITATOR_URL:-https://facilitator.openx402.ai}
      - NODE_ENV=production
    volumes:
      - gateway-data:/app/data
      - gateway-logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  gateway-data:
  gateway-logs:
